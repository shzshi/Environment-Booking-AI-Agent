<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Environment Booking Assistant</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header text-center">
            <h3>Environment Booking Assistant</h3>
            <a href="{{ url_for('reset') }}" class="reset-chat-btn" title="Start Over">
                <i class="fas fa-redo"></i>
            </a>
        </div>

        <!-- Chat Body -->
        <div class="chat-body" id="chatWindow">

            <!-- Initial AI Msg -->
            <div class="message agent-message">
                <div class="message-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png">
                </div>
                <div class="message-content">
                    👋 Hi! I'm Shzshi, your environment booking assistant.
                    How can I help you today?
                </div>
            </div>

            <!-- Chat History -->
            {% for msg in session.agent_state['messages'] %}
            <div class="message {% if msg.type == 'human' %}user-message{% else %}agent-message{% endif %}">
                <div class="message-icon">
                    <img src="{% if msg.type == 'human' %}
                        https://cdn-icons-png.flaticon.com/512/456/456212.png
                        {% else %}
                        https://cdn-icons-png.flaticon.com/512/4712/4712100.png
                        {% endif %}">
                </div>
                <div class="message-content">
                    {{ msg.content }}
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Input -->
        <div class="input-area">
            <form method="POST" action="{{ url_for('booking') }}" id="chatForm" class="d-flex">
                <input type="text" name="user_input" id="userInput"
                       class="form-control chat-input"
                       placeholder="Type your message..." required>
                <button type="submit" class="btn send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>

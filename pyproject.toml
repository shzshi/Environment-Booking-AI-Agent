[project]
name = "environment-booking-agent"
version = "0.1.0"
description = "AI-powered environment booking system"
requires-python = ">=3.11"
dependencies = [
    "langchain==0.3.10",
    "langgraph==0.2.45",
    "langserve==0.3.0",
    "langsmith>=0.1.17,<0.2.0",
    "langchain-core==0.3.59",
    "langchain-groq==0.2.1",
    "langchain-ollama==0.2.1",
    "langchain-google-genai==2.0.7",
    "uuid==1.30",
    "flask==3.1.0",
    "pydantic==2.11.4",
    "pydantic-core==2.33.2",
    "python-dotenv==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
